<!doctype html>
<html lang="en" class="bar-window">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/viby-icon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viby</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- A small audio instrument on the bottom edge, never a chat window:
         discard on the left, the live level in the middle, and — only when the
         user asked to confirm before inserting — accept on the right. Only the
         current provisional preview is ever shown. -->
    <div id="capsule" class="dock" data-state="idle">
      <!-- The routine state is announced, not printed: the dock's own colour
           and motion carry it, and a standing label is only noise. -->
      <p
        id="state"
        class="state visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
      <p id="notice" class="notice" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
      <!-- One text run: the chip is generated by CSS so the accessible name is
           a single "Provisional …" utterance, not two fragments. -->
      <p id="preview" class="preview" hidden>
        <span id="preview-text"></span>
      </p>
      <div id="controls" class="controls" hidden>
        <button id="cancel" class="circle cancel" type="button" aria-label="Cancel" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7 7l10 10M17 7L7 17" />
          </svg>
        </button>
        <div id="pill" class="pill">
          <!-- Animated bars: decorative twin of the meter, which carries the
               accessible level. -->
          <div id="wave" class="wave" aria-hidden="true"></div>
          <div
            id="meter"
            class="meter"
            role="progressbar"
            aria-label="Audio level"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            hidden
          ></div>
        </div>
        <button id="accept" class="circle accept" type="button" aria-label="Accept" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 13l4.5 4.5L19 8" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
